<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="white">
    <title>七夕心愿兑换卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-text-size-adjust: 100%;
        }
        body {
            min-height: 100vh;
            /* 优化Safari渐变偏色 */
            background: #ffe8cc;
            background-image: linear-gradient(135deg, #ffd6e0 0%, #ffe8cc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            overflow: hidden;
        }
        .heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .heart {
            position: absolute;
            color: #ff7b9c;
            animation: fall linear infinite;
            opacity: 0.7;
        }
        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        .flip-wrap {
            width: 100%;
            max-width: 300px;  /* 缩小卡片最大宽度 */
            max-height: 82vh;
            perspective: 1200px;
            cursor: pointer;
            z-index: 2;
        }
        .flip-card {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 158%;
            transition: transform 0.8s ease-in-out;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }
        .flip-wrap.open .flip-card {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            box-shadow: 0 8px 26px rgba(255, 126, 159, 0.22);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(20px,4.5vw,34px) clamp(18px,3.5vw,28px);
            background: #ffffff;
        }
        .front-icon {
            font-size: clamp(56px,12vw,78px);
            margin-bottom: 14px;
        }
        .front-tip {
            font-size: clamp(15px,3.6vw,18px);
            color: #d65c7b;
        }
        .card-back {
            transform: rotateY(180deg);
        }
        .card-title {
            font-size: clamp(20px,4.6vw,24px);
            color: #d65c7b;
            margin-bottom: 18px;
            font-weight: bold;
        }
        .decor-line {
            width: 72px;
            height: 2px;
            background: #ffb6c1;
            margin: 0 auto 18px;
            border-radius: 1px;
        }
        .text-item {
            font-size: clamp(14px,3.3vw,16px);
            color: #444;
            line-height: 1.9;
            width: 100%;
            text-align: left;
        }
        .blessing {
            margin: 12px 0;
            font-size: clamp(12px,3vw,14px);
            color: #666;
            line-height: 1.65;
            text-align: center;
        }
        .input-box {
            width: 100%;
            height: 46px;
            border: 1px solid #d65c7b;
            border-radius: 8px;
            margin-top: 10px;
            padding: 0 14px;
            font-size: 16px;
            outline: none;
            background: #ffffff;
        }
        .input-box:focus {
            border-color: #ff7b9c;
            box-shadow: 0 0 0 2px rgba(255,123,156,0.2);
        }
        .submit-btn{
            margin-top:12px;
            padding:9px 24px;
            border:none;
            background:#d65c7b;
            color:#fff;
            border-radius:8px;
            font-size:15px;
            cursor:pointer;
            transition: opacity 0.2s;
        }
        .submit-btn:active{ opacity:0.85; }
        .submit-btn:disabled{ background:#bbb; cursor:not-allowed; }
    </style>
</head>
<body>
    <div class="heart-container" id="heartBox"></div>
    <div class="flip-wrap" id="cardWrap">
        <div class="flip-card">
            <div class="card-front">
                <div class="front-icon">💌</div>
                <div class="front-tip">点击打开</div>
            </div>
            <div class="card-back">
                <div class="card-title">七夕心愿兑换卡</div>
                <div class="decor-line"></div>
                <div class="text-item">
                    持有人：江心雁小宝宝<br>
                    可兑换：心仪礼物<br>
                    有效期：十万年
                </div>
                <div class="blessing">
                    愿朝夕相伴，岁岁相依，<br>
                    所有期待皆有回响，所有心愿终会抵达。
                </div>
                <input class="input-box" id="wishInput" placeholder="请填写心仪礼物">
                <button class="submit-btn" id="submitBtn">提交心愿</button>
            </div>
        </div>
    </div>
    <script>
        // =========替换为你的Railway接口地址=========
        const apiUrl = "https://wish-api-production-d543.up.railway.app/submit";
        // ==========================================
        const wrap = document.getElementById('cardWrap');
        const wishInput = document.getElementById('wishInput');
        const submitBtn = document.getElementById('submitBtn');
        wrap.addEventListener('click', (e)=>{
            if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON'){
                wrap.classList.toggle('open');
            }
        })
        // 本地缓存心愿
        const savedWish = localStorage.getItem('wishGift');
        if(savedWish) wishInput.value = savedWish;
        wishInput.addEventListener('input', function(){
            localStorage.setItem('wishGift', this.value);
        });
        // 提交请求
        submitBtn.onclick = async function(){
            const wish = wishInput.value.trim();
            if(!wish){ alert("请先填写心仪礼物！"); return; }
            submitBtn.disabled = true;
            submitBtn.innerText = "提交中...";
            try{
                const res = await fetch(apiUrl,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({wish})
                });
                const data = await res.json();
                if(data.success){
                    alert("心愿提交成功！我已经收到啦");
                    wishInput.value = "";          // ✅ 清空输入框
                    localStorage.removeItem('wishGift'); // 清除本地缓存
                }else{
                    alert("提交失败："+data.msg);
                }
            }catch(err){
                alert("网络出错，切换手机浏览器重试");
            }
            submitBtn.disabled = false;
            submitBtn.innerText = "提交心愿";
        }
        // 爱心动画（略微降低频率，手机更流畅）
        const heartBox = document.getElementById('heartBox');
        function createHeart(){
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '♥';
            const size = Math.random()*20 + 26;
            heart.style.fontSize = size + 'px';
            heart.style.left = Math.random()*110 + '%';
            const duration = Math.random()*7 + 2;
            heart.style.animationDuration = duration + 's';
            heartBox.appendChild(heart);
            setTimeout(()=>heart.remove(), duration * 1000);
        }
        setInterval(createHeart, 130);
    </script>
</body>
</html>
